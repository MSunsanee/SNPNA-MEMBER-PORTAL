function notify(s){$('notice').textContent=s;$('notice').style.display=s?'block':'none'}
async function api(action,args={}){if(!url)throw Error('กรุณาตั้งค่า URL จาก GAS ก่อน');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),120000);try{const res=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:session?.token,...args}),signal:controller.signal});const raw=await res.text();let r;try{r=JSON.parse(raw)}catch{throw Error('GAS ไม่ส่ง JSON: ตรวจ URL /exec และสิทธิ์ Anyone ตามคู่มือ')}if(!r.ok)throw Error(r.error);return r.data;}catch(e){if(e.name==='AbortError')throw Error('การเชื่อมต่อหมดเวลา อย่ากดส่งรายการเงินซ้ำ ให้ตรวจข้อมูลก่อน');if(e instanceof TypeError)throw Error('เชื่อมต่อไม่ได้ ตรวจเครือข่าย URL และการ deploy GAS');throw e}finally{clearTimeout(timer)}}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);notify('กำลังดำเนินการ…');try{await fn();notify('')}catch(e){notify(e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function loadPublic(){if(!url){render();return}await run(async()=>{pub=await api('public');$('connection').textContent='เชื่อมต่อ Google Sheets • '+new Date().toLocaleTimeString('th-TH');render()})}
async function refresh(){if(session&&!session.mustChange)data=await api('data');pub=await api('public');render()}
function nav(){let items=[['dashboard','ภาพรวมสมาคม'],['news','ข่าวสารและประกาศ'],['events','กิจกรรมและอบรม'],['apply','สมัครสมาชิก']];if(session&&!session.mustChange)items.push(['members',admin()?'ทะเบียนสมาชิก':'ข้อมูลของฉัน'],['finance','ค่าบำรุงและการชำระ'],['welfare','สวัสดิการและคำร้อง']);if(admin()&&!session.mustChange)items.push(['applications','คำขอสมัครสมาชิก'],['manage','จัดการสมาคม'],['audit','ประวัติการดำเนินงาน']);$('nav').innerHTML=items.map(([id,label])=>`<button class="${page===id?'active':''}" data-page="${id}">${label}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('loginButton').textContent=session?session.username:'เข้าสู่ระบบ';$('loginButton').onclick=session?accountDialog:loginDialog}

if(page==='finance'){const inv=data.invoices;$('content').innerHTML=`<h2>ค่าบำรุงและการชำระเงิน</h2><div class="grid">${[['เรียกเก็บ',inv.reduce((a,x)=>a+Number(x.amount),0)],['ชำระแล้ว',inv.reduce((a,x)=>a+Number(x.paid),0)],['คงเหลือ',inv.reduce((a,x)=>a+Number(x.amount)-Number(x.paid),0)],['รอตรวจสอบ',data.payments.filter(x=>x.status==='รอตรวจสอบ').length]].map(([t,n])=>`<div class="card"><span class="muted">${t}</span><div class="metric">${money(n)}</div></div>`).join('')}</div><div class="card"><h3>ช่องทางชำระ</h3><p>${esc(data.settings.find(x=>x.key==='bankInstructions')?.value)}</p><h3>รายการเรียกเก็บ</h3>${inv.length?table(['สมาชิก','รายการ','ปี','ยอด','ชำระแล้ว','สถานะ','ดำเนินการ'],inv.map(i=>`<tr><td>${esc(memberName(i.memberId))}</td><td>${esc(i.label)}</td><td>${esc(i.year)}</td><td>${money(i.amount)}</td><td>${money(i.paid)}</td><td>${esc(i.status)}</td><td>${!admin()&&Number(i.paid)<Number(i.amount)?`<button onclick="paymentDialog('${attr(i.id)}')">แจ้งชำระ</button>`:''}</td></tr>`)):empty()}</div><div class="card" style="margin-top:20px"><h3>ประวัติแจ้งชำระ</h3>${data.payments.length?table(['สมาชิก','ยอด','หลักฐานอ้างอิง','สถานะ','ดำเนินการ'],data.payments.map(p=>`<tr><td>${esc(memberName(p.memberId))}</td><td>${money(p.amount)}</td><td>${esc(p.reference)}</td><td>${esc(p.status)}</td><td>${admin()&&p.status==='รอตรวจสอบ'?`<button onclick="reviewPayment('${attr(p.id)}','ยืนยันแล้ว')">ยืนยัน</button><button class="secondary" onclick="reviewPayment('${attr(p.id)}','ไม่ผ่าน')">ไม่ผ่าน</button>`: `<button class="secondary" onclick="receipt('${attr(p.id)}')">รายละเอียด</button>`}</td></tr>`)):empty()}</div>`;return}

function renderNewsPage(){const announcements=(pub?.news||[]).slice().reverse(),items=pub?.externalNews||[],updated=pub?.newsUpdatedAt?new Date(pub.newsUpdatedAt).toLocaleString('th-TH'):'ยังไม่เคยอัปเดต';$('content').innerHTML=`<div class="top"><div><h2>ประกาศสมาคม</h2><p class="muted">ข่าวและประกาศจากสมาคมพยาบาล อบจ.สกลนคร</p></div></div><div class="stack">${newsHtml(announcements)}</div><section class="news-section"><div class="top"><div><h2>ข่าวสารวิชาชีพพยาบาล</h2><p class="muted">รวบรวมข่าวอบรม ประชุมวิชาการ ทุน และความก้าวหน้าจากแหล่งข่าวภายนอก</p></div>${admin()?'<button id="refreshNewsButton" onclick="refreshNewsNow()">อัปเดตข่าวตอนนี้</button>':''}</div><p class="muted">อัปเดตล่าสุด ${esc(updated)} • ระบบตรวจข่าวอัตโนมัติทุกวัน</p><div class="stack">${items.length?items.map(n=>`<article class="card external-news"><div class="news-meta"><span class="pill">${esc(n.source||'ข่าวพยาบาล')}</span><small class="muted">${esc(n.publishedAt?new Date(n.publishedAt).toLocaleDateString('th-TH'):'วันที่ไม่ระบุ')}</small></div><h3>${esc(n.title)}</h3>${n.summary?`<p>${esc(n.summary)}</p>`:''}<a href="${attr(n.url)}" target="_blank" rel="noopener noreferrer">อ่านข่าวต้นฉบับ ↗</a></article>`).join(''):empty('ยังไม่มีข่าวออนไลน์ กดอัปเดตข่าวตอนนี้หรือรอรอบอัตโนมัติ')}</div></section>`}
async function refreshNewsNow(){await run(async()=>{const result=await api('refreshNews');pub=await api('public');render();notify(`อัปเดตข่าวแล้ว ${result.count} รายการ`)})}function renderApplyPage(){const districts=['เมืองสกลนคร','กุสุมาลย์','กุดบาก','พรรณานิคม','พังโคน','วาริชภูมิ','นิคมน้ำอูน','วานรนิวาส','คำตากล้า','บ้านม่วง','อากาศอำนวย','สว่างแดนดิน','ส่องดาว','เต่างอย','โคกศรีสุพรรณ','เจริญศิลป์','โพนนาแก้ว','ภูพาน'];$('content').innerHTML=`<div class="card application-card"><h2>สมัครสมาชิกสมาคมพยาบาล</h2><p class="muted">กรอกข้อมูลเพื่อส่งคำขอให้สมาคมตรวจสอบ ข้อมูลส่วนบุคคลจะเห็นได้เฉพาะผู้ดูแลระบบ</p><form id="applicationForm" class="application-form"><h3>ข้อมูลส่วนตัว</h3><div class="form-grid">${field('name','ชื่อ–สกุล','text','',true)}${field('nationalId','เลขบัตรประชาชน (13 หลัก)','text','',true)}${field('birthDate','วันเดือนปีเกิด','date','',false)}<label>หมู่เลือด<select name="bloodType"><option value="">เลือกหมู่เลือด</option>${['A','B','AB','O','ไม่ทราบ'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>อำเภอ<select name="district" required><option value="">เลือกอำเภอ</option>${districts.map(x=>`<option>${x}</option>`).join('')}</select></label>${field('unit','หน่วยงาน / โรงพยาบาล','text','',true)}${field('position','ระดับตำแหน่ง','text','',false)}${field('qualification','วุฒิการศึกษา','text','',false)}${field('special','คุณสมบัติพิเศษ','text','',false)}${field('nurseMemberNo','เลขสมาชิกพยาบาล','text','',false)}${field('licenseNo','เลขที่ใบประกอบวิชาชีพ','text','',false)}${field('serviceYears','อายุราชการ (ปี)','number','',false)}${field('phone','เบอร์โทรศัพท์','tel','',true)}${field('email','อีเมล','email','',false)}</div><label>ความต้องการศึกษาต่อ<textarea name="studyNeed" rows="3" maxlength="500"></textarea></label><p><label><input type="checkbox" required> ยินยอมให้สมาคมใช้ข้อมูลนี้เพื่อตรวจสอบคำขอและจัดทำทะเบียนสมาชิก</label></p><button type="submit">ส่งคำขอสมัครสมาชิก</button></form></div>`;document.getElementById('applicationForm').addEventListener('submit',e=>{e.preventDefault();run(async()=>{const values=Object.fromEntries(new FormData(e.currentTarget));const result=await api('apply',values);$('content').innerHTML=`<div class="card"><h2>ส่งคำขอเรียบร้อยแล้ว</h2><p>สถานะ: ${esc(result.status)}</p><p class="muted">หมายเลขคำขอ ${esc(result.applicationId)} กรุณาเก็บหมายเลขนี้ไว้ติดต่อสมาคม</p><button class="secondary" onclick="page='dashboard';render()">กลับหน้าแรก</button></div>`})})}
function renderApplications(){const apps=data?.applications||[];$('content').innerHTML=`<h2>คำขอสมัครสมาชิก</h2><p class="muted">ข้อมูลส่วนบุคคลในหน้านี้เห็นได้เฉพาะผู้ดูแลระบบ หลังอนุมัติบัญชีสมาชิกจะยังปิดอยู่จนกว่าจะตรวจสอบตัวตนและเปิดใช้งาน</p><div class="stack">${apps.length?apps.map(a=>`<div class="card"><h3>${esc(a.name)} <span class="pill">${esc(a.status)}</span></h3><p>เลขบัตร ${esc(a.nationalId)} • เกิด ${esc(a.birthDate||'-')} • หมู่เลือด ${esc(a.bloodType||'-')}</p><p>${esc(a.district)} • ${esc(a.unit)} • ${esc(a.position||'-')} • วุฒิ ${esc(a.qualification||'-')} • พิเศษ ${esc(a.special||'-')}</p><p>โทร ${esc(a.phone)} • ${esc(a.email||'-')}<br>เลขสมาชิก ${esc(a.nurseMemberNo||'-')} • ใบประกอบฯ ${esc(a.licenseNo||'-')} • อายุราชการ ${esc(a.serviceYears||'-')} ปี</p><p>ศึกษาต่อ: ${esc(a.studyNeed||'-')}</p><small class="muted">ส่งเมื่อ ${esc(a.submittedAt)}</small><div class="toolbar"><button onclick="reviewApplication('${attr(a.id)}','อนุมัติ')">อนุมัติและสร้างบัญชี (ปิดไว้)</button><button class="secondary" onclick="reviewApplication('${attr(a.id)}','ขอข้อมูลเพิ่มเติม')">ขอข้อมูลเพิ่มเติม</button><button class="danger" onclick="reviewApplication('${attr(a.id)}','ไม่อนุมัติ')">ไม่อนุมัติ</button></div>${a.username?`<p class="muted">บัญชี ${esc(a.username)} • ต้องตรวจสอบตัวตนและเปิดใช้ก่อนเข้าสู่ระบบ</p>`:''}</div>`).join(''):empty('ยังไม่มีคำขอสมัครสมาชิก')}</div>`}
function reviewApplication(id,status){if(!confirm('ยืนยันการพิจารณาคำขอนี้: '+status+'?'))return;mutate('reviewApplication',{id,status})}function renderDistrictChart(){const target=$("districtChart");if(!target)return;const counts=pub?.groupCounts?.district||{},entries=Object.entries(counts).filter(([name])=>String(name||"").trim()).sort((a,b)=>Number(b[1]||0)-Number(a[1]||0)||a[0].localeCompare(b[0],"th")),total=entries.reduce((n,[,v])=>n+Number(v||0),0),max=Math.max(1,...entries.map(([,v])=>Number(v||0)));target.innerHTML=`<div class="district-chart-head"><h3>จำนวนสมาชิกแยกตามอำเภอ</h3><strong>${total.toLocaleString("th-TH")} คน • ${entries.length} อำเภอ</strong></div>${entries.length?`<div class="district-bars" role="img" aria-label="กราฟจำนวนสมาชิกแยกตามอำเภอ">${entries.map(([name,value])=>`<div class="district-row"><span class="district-name" title="${esc(name)}">${esc(name)}</span><div class="district-track"><div class="district-fill" style="width:${Math.max(1,Number(value||0)/max*100)}%"></div></div><span class="district-value">${Number(value||0).toLocaleString("th-TH")}</span></div>`).join("")}</div>`:empty("ยังไม่มีข้อมูลรายอำเภอ")}`}function renderMembers(){if(!admin()){const m=data.members[0];$('content').innerHTML=m?`<h2>ข้อมูลของฉัน</h2><div class="columns"><div class="card"><h3>${esc(m.name)}</h3><p>หน่วยงาน: ${esc(m.unit)}<br>อำเภอ: ${esc(m.district)}<br>ตำแหน่ง: ${esc(m.position)}<br>ประเภท: ${esc(m.type)}<br>สถานะ: ${esc(m.status)}<br>บัญชี: ${esc(m.bank)}</p></div><form class="card profile-form" id="profile"><h3>ข้อมูลส่วนตัว</h3><p class="muted">ข้อมูลนี้แก้ไขได้เฉพาะเจ้าของบัญชีและผู้ดูแลระบบ</p><label>เลขบัตรประชาชน<input name="nationalId" inputmode="numeric" maxlength="13" value="${attr(m.nationalId)}" placeholder="ตัวเลข 13 หลัก"></label><label>วันเดือนปีเกิด<input name="birthDate" type="date" value="${attr(m.birthDate)}"></label><label>หมู่เลือด<select name="bloodType"><option value="">เลือกหมู่เลือด</option>${['A','B','AB','O','ไม่ทราบ'].map(x=>`<option ${m.bloodType===x?'selected':''}>${x}</option>`).join('')}</select></label><label>เลขสมาชิกพยาบาล<input name="nurseMemberNo" value="${attr(m.nurseMemberNo)}"></label><label>เลขที่ใบประกอบวิชาชีพ<input name="licenseNo" value="${attr(m.licenseNo)}"></label><label>อายุราชการ (ปี)<input name="serviceYears" type="number" min="0" max="60" step="0.5" value="${attr(m.serviceYears)}"></label><label>ความต้องการศึกษาต่อ<textarea name="studyNeed" maxlength="500" rows="3">${esc(m.studyNeed||'')}</textarea></label><label>โทรศัพท์<input name="phone" value="${attr(m.phone)}"></label><label>อีเมล<input type="email" name="email" value="${attr(m.email)}"></label><button>บันทึกข้อมูล</button></form></div>`:empty();$('profile')?.addEventListener('submit',e=>{e.preventDefault();mutate('profile',Object.fromEntries(new FormData(e.target)))});return}$('content').innerHTML=`<div class="top"><h2>ทะเบียนสมาชิก</h2><button class="secondary" onclick="exportMembers()">ส่งออก CSV (ไม่รวมบัญชี)</button></div><div class="toolbar"><input id="search" placeholder="ค้นหาชื่อ อำเภอ หน่วยงาน"><span class="muted">${data.members.length} รายชื่อ</span></div><div class="card" style="margin-top:16px" id="memberTable"></div>`;$('search').oninput=()=>memberTable($('search').value);memberTable('')}
function memberTable(q){const ms=data.members.filter(m=>[m.name,m.district,m.unit].join(' ').includes(q));$('memberTable').innerHTML=table(['ชื่อ–สกุล','อำเภอ / หน่วยงาน','ตำแหน่ง','ประเภท','สถานะ','บัญชีผู้ใช้','ดำเนินการ'],ms.map(m=>{const u=data.users.find(x=>x.memberId===m.id);return `<tr><td>${esc(m.name)}</td><td>${esc(m.district)}<br>${esc(m.unit)}</td><td>${esc(m.position)}</td><td>${esc(m.type)}</td><td><span class="pill">${esc(m.status)}</span></td><td>${esc(u?.username)}<br>${u?.enabled?'เปิดใช้':'ปิดใช้'}</td><td><button onclick="memberDialog('${attr(m.id)}')">แก้สถานะ</button><button class="secondary" onclick="activate('${attr(m.id)}',${!u?.enabled})">${u?.enabled?'ปิดบัญชี':'ยืนยันตัวตน / เปิดบัญชี'}</button></td></tr>`}));}
function renderManage(){$('content').innerHTML=`<h2>จัดการสมาคม</h2><div class="columns"><div class="stack"><div class="card"><h3>รายการเรียกเก็บ</h3><button onclick="feeDialog()">เพิ่มรายการ / ปีใหม่</button>${data.fees.map(f=>`<p>${esc(f.name)} • ${esc(f.year)} • ${money(f.amount)} บาท <button onclick="bill('${attr(f.id)}')">สร้างยอดเรียกเก็บ</button></p>`).join('')}<small class="muted">สร้างให้สมาชิกปกติ ยกเว้นกิตติมศักดิ์ ไม่สร้างรายการซ้ำ ไม่เรียกย้อนหลังอัตโนมัติ</small></div><div class="card"><h3>บัญชีรับเงินสมาคม</h3><textarea id="bank" rows="4">${esc(data.settings.find(x=>x.key==='bankInstructions')?.value)}</textarea><button onclick="mutate('bankSettings',{value:$('bank').value})">บันทึก</button></div></div><div class="stack"><div class="card"><h3>ข่าวสาร</h3><button onclick="newsDialog()">เพิ่มประกาศ</button></div><div class="card"><h3>กิจกรรม</h3><button onclick="eventDialog()">เพิ่มกิจกรรม</button></div><div class="card"><h3>รหัสผ่านและข้อมูล</h3><button class="secondary" onclick="passwordDialog()">เปลี่ยนรหัสผ่านของฉัน</button><p class="muted">รายชื่อที่นำเข้ารอการยืนยันตัวตนก่อนเปิดใช้ ข้อมูลบัญชีแสดงเฉพาะ 4 หลักท้าย</p></div></div></div>`}
function dialog(title,html,submit){$('modal').innerHTML=`<button type="button" class="close" onclick="$('modal').close()">✕</button><h2>${esc(title)}</h2><form id="dialogForm">${html}</form>`;$('modal').showModal();$('dialogForm').onsubmit=e=>{e.preventDefault();run(async()=>{await submit(Object.fromEntries(new FormData(e.target)))})}}
const field=(name,label,type='text',value='',required=true)=>`<label>${label}<input name="${name}" type="${type}" value="${attr(value)}" ${required?'required':''}></label>`;
function connectDialog(){dialog('เชื่อมต่อ Google Sheets',`<p class="muted">วาง Web App URL ที่ลงท้าย /exec ไม่ใช่ URL หน้าชีต</p>${field('url','GAS Web App URL','url',url)}<button>บันทึกและเชื่อมต่อ</button>`,async f=>{if(!/^https:\/\/script.google.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(f.url.trim()))throw Error('URL ต้องเป็น https://script.google.com/macros/s/.../exec');url=f.url.trim();localStorage.setItem('snpna_url',url);session=null;data=null;page='dashboard';pub=await api('public');$('modal').close();$('connection').textContent='เชื่อมต่อแล้ว';render()})}
function loginDialog(){dialog('เข้าสู่ระบบ',`<p class="muted">ผู้ดูแล: admin • สมาชิก: ชื่อ–สกุลภาษาไทยตามทะเบียน</p>${field('username','ชื่อผู้ใช้')}${field('password','รหัสผ่าน','password')}<button>เข้าสู่ระบบ</button><p class="muted">บัญชีสมาชิกต้องได้รับการยืนยันจากผู้ดูแลก่อน หากลืมรหัสให้ติดต่อผู้ดูแลสมาคม</p>`,async f=>{f.username=String(f.username||'').trim();if(/^admin$/i.test(f.username))f.username='admin';session=await api('login',f);$('modal').close();if(session.mustChange){render();passwordDialog()}else{await refresh();page='dashboard';render()}})}
function passwordDialog(){dialog('เปลี่ยนรหัสผ่าน',`<p>รหัสใหม่อย่างน้อย 10 ตัวอักษร ${session?.mustChange?'ต้องเปลี่ยนรหัสเริ่มต้นก่อนใช้งาน':''}</p>${field('oldPassword','รหัสปัจจุบัน','password')}${field('newPassword','รหัสใหม่','password')}${field('confirm','ยืนยันรหัสใหม่','password')}<button>เปลี่ยนรหัส</button>`,async f=>{if(f.confirm!==f.newPassword)throw Error('รหัสยืนยันไม่ตรงกัน');await api('changePassword',f);session=null;data=null;page='dashboard';$('modal').close();render();loginDialog()})}
function accountDialog(){dialog('บัญชีของฉัน',`<p>${esc(session.username)}</p><button type="button" onclick="$('modal').close();passwordDialog()">เปลี่ยนรหัสผ่าน</button> <button type="button" class="secondary" onclick="logout()">ออกจากระบบ</button>`,async()=>{})}
async function logout(){await run(async()=>{await api('logout');session=null;data=null;page='dashboard';$('modal').close();render()})}
async function mutate(action,args){await run(async()=>{await api(action,args);await refresh()})}
function memberDialog(id){const m=data.members.find(x=>x.id===id);dialog('สถานะสมาชิก',`<p>${esc(m.name)}</p><label>ประเภท<select name="type">${['สามัญ','วิสามัญ','กิตติมศักดิ์'].map(t=>`<option ${t===m.type?'selected':''}>${t}</option>`).join('')}</select></label><label>สถานะ<select name="status">${['รอยืนยัน','ปกติ','ลาออก','พ้นสมาชิก'].map(t=>`<option ${t===m.status?'selected':''}>${t}</option>`).join('')}</select></label><button>บันทึก</button>`,async f=>{await api('memberUpdate',{id,...f});$('modal').close();await refresh()})}
function activate(memberId,enabled){if(confirm(enabled?'ยืนยันว่าตรวจสอบตัวตนและสถานะของสมาชิกนี้แล้ว และต้องการเปิดบัญชี?':'ปิดบัญชีนี้?'))mutate('activate',{memberId,enabled})}
function feeDialog(){dialog('เพิ่มรายการเรียกเก็บ',field('name','ชื่อรายการ','text','ค่าบำรุงรายปี')+field('amount','จำนวนเงิน (บาท)','number',300)+field('year','ปี พ.ศ.','number',new Date().getFullYear()+543)+'<button>เพิ่มรายการ</button>',async f=>{await api('addFee',f);$('modal').close();await refresh()})}

function reviewPayment(id,status){if(confirm('ยืนยันผลตรวจสอบ: '+status+'?'))mutate('reviewPayment',{id,status})}
function receipt(id){const p=data.payments.find(x=>x.id===id),i=data.invoices.find(x=>x.id===p.invoiceId);dialog('รายละเอียดการแจ้งชำระ',`<p>เลขรายการ: ${esc(p.id)}<br>สมาชิก: ${esc(memberName(p.memberId))}<br>รายการ: ${esc(i?.label)} ปี ${esc(i?.year)}<br>ยอด ${money(p.amount)} บาท<br>อ้างอิง ${esc(p.reference)}<br>สถานะ ${esc(p.status)}<br>ผู้ตรวจ ${esc(p.reviewer||'—')}</p><p class="muted">รายละเอียดจากระบบ ไม่ใช่ใบรับเงินทางการของสมาคม</p><button type="button" onclick="window.print()">พิมพ์</button>`,async()=>{})}
function welfareDialog(){dialog('ยื่นคำร้อง',field('title','หัวข้อ')+'<label>รายละเอียด<textarea name="detail" required rows="5"></textarea></label><button>ส่งคำร้อง</button>',async f=>{await api('welfare',f);$('modal').close();await refresh()})}
function newsDialog(){dialog('เพิ่มประกาศ',field('title','หัวข้อ')+'<label>รายละเอียด<textarea name="body" required rows="6"></textarea></label><button>เผยแพร่</button>',async f=>{await api('addNews',f);$('modal').close();await refresh()})}
function eventDialog(){dialog('เพิ่มกิจกรรม',field('title','ชื่อกิจกรรม')+field('date','วันที่ (ค.ศ.)','date')+field('place','สถานที่')+field('capacity','จำนวนรับ (0 = ไม่จำกัด)','number',0)+'<button>เพิ่มกิจกรรม</button>',async f=>{await api('addEvent',f);$('modal').close();await refresh()})}
function exportMembers(){const csv=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'").replace(/"/g,'""')+'"';const content='\ufeff'+[['ชื่อ–สกุล','อำเภอ','หน่วยงาน','ตำแหน่ง','ประเภท','สถานะ'],...data.members.map(m=>[m.name,m.district,m.unit,m.position,m.type,m.status])].map(r=>r.map(csv).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download='SNPNA_Members.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();loadPublic();
</script></html>
